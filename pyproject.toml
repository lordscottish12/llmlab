[project]
name = "llmlab"
version = "0.1.0"
description = "Interactive classroom demos of how large language models work"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "transformers>=4.56",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "safetensors",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "huggingface_hub[hf_xet]",
    "httpx",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
